name: Build SpendWise APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: spendwise-debug-keystore-v1

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Decode Release Keystore (if configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/spendwise-release.p12"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK & App Bundle
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.enabled == 'true' && format('{0}/spendwise-release.p12', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_TYPE: PKCS12
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SpendWise.apk
          fi

      - name: Upload Signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Release-APK
          path: app/build/outputs/apk/release/SpendWise.apk
          retention-days: 30

      - name: Upload Signed Release App Bundle (Play Store)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Unsigned Release APK (Fallback)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-Release-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Publish Direct Download Link on GitHub Releases
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          NOTES="Latest signed SpendWise Android build (${{ github.sha }}). Install directly on Android; for SMS tracking on Android 13+, tap App Info -> ⋮ -> Allow restricted settings -> Permissions -> SMS."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/SpendWise.apk --clobber
            gh release edit "$TAG" --title "SpendWise Latest (Android APK)" --notes "$NOTES"
          else
            gh release create "$TAG" app/build/outputs/apk/release/SpendWise.apk \
              --title "SpendWise Latest (Android APK)" \
              --notes "$NOTES"
          fi
